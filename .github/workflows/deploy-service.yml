name: Reusable Deployment
description: Shared reusable workflow for deploying services to a remote host.

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Target container service name'
        required: true
        type: string
      project_path:
        description: 'Target path on remote host'
        required: true
        type: string
      port:
        description: 'Port number to allow'
        required: true
        type: string
      port_description:
        description: 'Rule comment description'
        required: false
        type: string
        default: 'Microservice'
      extra_excludes:
        description: 'Additional rsync exclude patterns'
        required: false
        type: string
        default: ''
    secrets:
      USER:
        required: true
      HOST:
        required: true
      SSH_KEY:
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag or Commit Reference
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF_NAME="manual"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF_NAME="${GITHUB_REF#refs/tags/}"
          else
            REF_NAME="${GITHUB_SHA::8}"
          fi
          echo "tag=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          echo "Deploying ${{ inputs.service_name }} at ref: ${REF_NAME}"

      - name: Deploy to VPS
        env:
          SSH_USER: ${{ secrets.USER }}
          SSH_HOST: ${{ secrets.HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TARGET_PATH: ${{ inputs.project_path }}
          SERVICE: ${{ inputs.service_name }}
          PORT: ${{ inputs.port }}
          PORT_DESC: ${{ inputs.port_description }}
          EXTRA_EXCLUDES: ${{ inputs.extra_excludes }}
          GIT_TAG: ${{ steps.meta.outputs.tag }}
          DEPLOY_TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PRODUCTION: ${{ secrets.DATABASE_PRODUCTION }}
          DATABASE_GRAPH: ${{ secrets.DATABASE_GRAPH }}
          DATABASE_SYSTEM: ${{ secrets.DATABASE_SYSTEM }}
          DATABASE_ACCESS_TOKEN: ${{ secrets.DATABASE_ACCESS_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          JWT_REFRESH_WEB_SECRET: ${{ secrets.JWT_REFRESH_WEB_SECRET }}
          JWT_REFRESH_TOKEN_WEB_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_WEB_SECRET }}
          JWT_REFRESH_APP_SECRET: ${{ secrets.JWT_REFRESH_APP_SECRET }}
          JWT_REFRESH_TOKEN_APP_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_APP_SECRET }}
          JWT_SERVICE_SECRET: ${{ secrets.JWT_SERVICE_SECRET }}
          JWT_INTERNAL_SERVICE_SECRET: ${{ secrets.JWT_INTERNAL_SERVICE_SECRET }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MEDIA_PUBLIC_URL: ${{ secrets.MEDIA_PUBLIC_URL }}
          PUBLIC_MEDIA_URL: ${{ secrets.PUBLIC_MEDIA_URL }}
          NEXT_PUBLIC_MEDIA_API_URL: ${{ secrets.NEXT_PUBLIC_MEDIA_API_URL }}
        run: |
          echo "🔐 Configuring SSH client..."
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

          echo "📁 Ensuring remote directory exists: ${TARGET_PATH}"
          ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" "mkdir -p ${TARGET_PATH}"

          echo "📦 Syncing code via rsync to VPS..."
          eval "EXTRA_EXCLUDES_ARR=(${EXTRA_EXCLUDES})"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.gocache' \
            "${EXTRA_EXCLUDES_ARR[@]}" \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "${SSH_USER}@${SSH_HOST}:${TARGET_PATH}"

          echo "🔐 Generating and transferring .env secrets to VPS..."
          ENV_TEMP="/tmp/${SERVICE}.env"
          echo "# Auto-generated by Sawari Sadhan Deploy Pipeline" > "${ENV_TEMP}"
          echo "ENV=production" >> "${ENV_TEMP}"
          echo "SERVICE_NAME=${SERVICE}" >> "${ENV_TEMP}"

          # Deterministic Cellular Port Suffix Calculation
          # Example: GIT_TAG v0.0.5 -> SUFFIX 5 -> Base 5000 -> HOST_PORT 50005
          VERSION_CLEAN="${GIT_TAG#v}"
          SUFFIX="${VERSION_CLEAN##*.}"
          SUFFIX="${SUFFIX: -1}"
          if [[ -z "${SUFFIX}" || ! "${SUFFIX}" =~ ^[0-9]$ ]]; then
            SUFFIX="1"
          fi

          if [[ -n "${PORT}" ]]; then
            HOST_PORT="${PORT}${SUFFIX}"
          else
            HOST_PORT="50001"
            PORT="5000"
          fi

          echo "PORT=${PORT}" >> "${ENV_TEMP}"
          echo "CONTAINER_PORT=${PORT}" >> "${ENV_TEMP}"
          echo "HOST_PORT=${HOST_PORT}" >> "${ENV_TEMP}"
          echo "RELEASE_TAG=${GIT_TAG}" >> "${ENV_TEMP}"

          [ -n "${DATABASE_URL}" ] && echo "DATABASE_URL=${DATABASE_URL}" >> "${ENV_TEMP}"
          [ -n "${DATABASE_PRODUCTION}" ] && echo "DATABASE_PRODUCTION=${DATABASE_PRODUCTION}" >> "${ENV_TEMP}"
          [ -n "${DATABASE_GRAPH}" ] && echo "DATABASE_GRAPH=${DATABASE_GRAPH}" >> "${ENV_TEMP}"
          [ -n "${DATABASE_SYSTEM}" ] && echo "DATABASE_SYSTEM=${DATABASE_SYSTEM}" >> "${ENV_TEMP}"
          [ -n "${DATABASE_ACCESS_TOKEN}" ] && echo "DATABASE_ACCESS_TOKEN=${DATABASE_ACCESS_TOKEN}" >> "${ENV_TEMP}"
          [ -n "${JWT_SECRET}" ] && echo "JWT_SECRET=${JWT_SECRET}" >> "${ENV_TEMP}"
          [ -n "${JWT_ACCESS_TOKEN_SECRET}" ] && echo "JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}" >> "${ENV_TEMP}"
          [ -n "${JWT_REFRESH_WEB_SECRET}" ] && echo "JWT_REFRESH_WEB_SECRET=${JWT_REFRESH_WEB_SECRET}" >> "${ENV_TEMP}"
          [ -n "${JWT_REFRESH_TOKEN_WEB_SECRET}" ] && echo "JWT_REFRESH_TOKEN_WEB_SECRET=${JWT_REFRESH_TOKEN_WEB_SECRET}" >> "${ENV_TEMP}"
          [ -n "${JWT_REFRESH_APP_SECRET}" ] && echo "JWT_REFRESH_APP_SECRET=${JWT_REFRESH_APP_SECRET}" >> "${ENV_TEMP}"
          [ -n "${JWT_REFRESH_TOKEN_APP_SECRET}" ] && echo "JWT_REFRESH_TOKEN_APP_SECRET=${JWT_REFRESH_TOKEN_APP_SECRET}" >> "${ENV_TEMP}"
          [ -n "${JWT_SERVICE_SECRET}" ] && echo "JWT_SERVICE_SECRET=${JWT_SERVICE_SECRET}" >> "${ENV_TEMP}"
          [ -n "${JWT_INTERNAL_SERVICE_SECRET}" ] && echo "JWT_INTERNAL_SERVICE_SECRET=${JWT_INTERNAL_SERVICE_SECRET}" >> "${ENV_TEMP}"
          [ -n "${CLOUDFLARE_R2_ENDPOINT}" ] && echo "CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT}" >> "${ENV_TEMP}"
          [ -n "${CLOUDFLARE_R2_ACCESS_KEY}" ] && echo "CLOUDFLARE_R2_ACCESS_KEY=${CLOUDFLARE_R2_ACCESS_KEY}" >> "${ENV_TEMP}"
          [ -n "${CLOUDFLARE_R2_SECRET_KEY}" ] && echo "CLOUDFLARE_R2_SECRET_KEY=${CLOUDFLARE_R2_SECRET_KEY}" >> "${ENV_TEMP}"
          [ -n "${CLOUDFLARE_R2_BUCKET}" ] && echo "CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET}" >> "${ENV_TEMP}"
          [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] && echo "CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "${ENV_TEMP}"
          [ -n "${CLOUDFLARE_API_TOKEN}" ] && echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}" >> "${ENV_TEMP}"
          [ -n "${MEDIA_PUBLIC_URL}" ] && echo "MEDIA_PUBLIC_URL=${MEDIA_PUBLIC_URL}" >> "${ENV_TEMP}"
          [ -n "${PUBLIC_MEDIA_URL}" ] && echo "PUBLIC_MEDIA_URL=${PUBLIC_MEDIA_URL}" >> "${ENV_TEMP}"
          [ -n "${NEXT_PUBLIC_MEDIA_API_URL}" ] && echo "NEXT_PUBLIC_MEDIA_API_URL=${NEXT_PUBLIC_MEDIA_API_URL}" >> "${ENV_TEMP}"

          scp -o StrictHostKeyChecking=no "${ENV_TEMP}" "${SSH_USER}@${SSH_HOST}:${TARGET_PATH}/.env"
          ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" "chmod 600 ${TARGET_PATH}/.env"
          rm -f "${ENV_TEMP}"

          echo "🚀 Launching cellular container on VPS (Host Port: ${HOST_PORT} -> Container: ${PORT})..."
          ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" bash -se << EOF
            if [ -n "${HOST_PORT}" ]; then
              echo '🛡️ Configuring firewall for cellular host port ${HOST_PORT}...'
              (command -v ufw >/dev/null 2>&1 && sudo ufw allow ${HOST_PORT}/tcp comment '${PORT_DESC} (${GIT_TAG})' 2>/dev/null && sudo ufw reload 2>/dev/null || true)
            fi

            cd "${TARGET_PATH}"
            CLEAN_TAG=\$(echo "${GIT_TAG}" | tr '[:upper:]' '[:lower:]' | tr '.' '-')
            PROJECT_NAME="sawarisadhan-\${CLEAN_TAG}"
            echo "🏗️ Building and launching \${PROJECT_NAME} for ${SERVICE}..."
            docker compose -p "\${PROJECT_NAME}" build
            docker compose -p "\${PROJECT_NAME}" up -d
            sleep 3
            docker compose -p "\${PROJECT_NAME}" ps
EOF
